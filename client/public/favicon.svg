<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glow)" stroke="#334155" stroke-width="2" />
  
  <!-- Left Building / Skyscraper -->
  <rect x="14" y="22" width="16" height="30" rx="3" fill="#3b82f6" fill-opacity="0.25" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <!-- Left Building Windows -->
  <line x1="19" y1="28" x2="25" y2="28" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
  <line x1="19" y1="34" x2="25" y2="34" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
  <line x1="19" y1="40" x2="25" y2="40" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />

  <!-- Center Luxury Tower with Spire & Gradient -->
  <path d="M26 18 L38 18 L38 52 L26 52 Z" fill="url(#grad)" />
  <!-- Tower Spire -->
  <line x1="32" y1="11" x2="32" y2="18" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Modern Geometric Roof Peak / Flow Chevron -->
  <path d="M20 18 L32 8 L44 18" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Tower Windows -->
  <circle cx="32" cy="24" r="1.75" fill="#ffffff" />
  <circle cx="32" cy="30" r="1.75" fill="#ffffff" />
  <circle cx="32" cy="36" r="1.75" fill="#ffffff" />
  <circle cx="32" cy="42" r="1.75" fill="#ffffff" />

  <!-- Right Building -->
  <rect x="34" y="26" width="16" height="26" rx="3" fill="#8b5cf6" fill-opacity="0.2" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
  <line x1="39" y1="32" x2="45" y2="32" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round" />
  <line x1="39" y1="38" x2="45" y2="38" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round" />

  <!-- Base Line Floor -->
  <line x1="10" y1="52" x2="54" y2="52" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
</svg>
